[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "loka"
version = "0.1.0"
description = "WhatsApp-first conversational real-estate platform (DDD / hexagonal)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "aio-pika>=9.5",
    "redis>=5.2",
    "structlog>=24.4",
    "boto3>=1.35",
    "cryptography>=43",
    "httpx>=0.27",
    "tenacity>=9.0",
    "prometheus-client>=0.21",
]

[project.optional-dependencies]
dev = [
    "boto3-stubs>=1.35",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "testcontainers[postgres,redis]>=4.8",
    "ruff>=0.7",
    "mypy>=1.13",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["loka*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "unit: pure domain tests, no infrastructure",
    "integration: requires real infrastructure via testcontainers",
    "e2e: full scenario across contexts",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
# Generated migrations are machine written: do not police their formatting.
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["loka"]

[tool.coverage.run]
source = ["loka"]
branch = true